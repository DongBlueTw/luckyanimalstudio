<!doctype html>
<html class="light" lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>符文詳情</title>

    <!-- Scripts & Styles -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,700&amp;family=Noto+Serif:wght@400;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="js/tailwind-config.js"></script>
    <link href="styles/style.css" rel="stylesheet" />
  </head>
  <body
    class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed"
  >
    <div id="app">
      <!-- Top Navigation -->
      <header
        class="bg-[#fff8f2] dark:bg-[#221b0b] font-['Newsreader'] tracking-[0.05em] uppercase docked full-width top-0 border-none bg-gradient-to-b from-[#fff2dd] to-transparent flat no shadows flex items-center justify-between px-6 h-16 w-full fixed z-50"
      >
        <div class="flex items-center">
          <a :href="mascotStudioUrl">
            <h1
              class="text-xl font-bold tracking-widest text-[#8f4900] dark:text-[#af6018]"
            >
              吉祥物工作室
            </h1>
          </a>
        </div>
      </header>

      <main class="pt-16 pb-24 min-h-screen relative" id="top">
        <!-- Hero Section: Rune Stone -->
        <section
          class="relative w-full min-h-[70vh] py-12 flex items-center justify-center overflow-hidden bg-surface-container-low"
        >
          <div
            class="absolute inset-0 opacity-10 mix-blend-multiply"
            style="
              background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuAazjFaPiM1-sVfVqJITqO6OunQ8Zhqf_00mMona0ACONA1n-Dmn9m2uUuDRw86zBjug2FM4ZISoM3DDIx2KY5pjHcewQkaDsQyjNqsU6DbP8pi58aB1BULNkcdt-h1NWzXCJGAE_-nBj7s-bxd6EusnRbP7HPOdPttmiCbq0tCTtIZ1q-oLsBxJoDL__-SpQdl46w18B4T8NA9cDccT87d_8rELR67yeTge0pGxxWyWKgVmorkabOB3FjB9rBVnE7aE4ZXI42Azw&quot;);
            "
          ></div>

          <div
            class="relative z-10 w-[90%] max-w-[400px] flex items-center justify-center mb-4"
          >
            <!-- Main Rune Image from runes_images folder -->
            <img
              v-if="currentRune && !imageError"
              :src="`runes_images/${currentRune.id}.png`"
              @error="onImageError"
              alt="Rune Image"
              class="w-full h-auto object-contain drop-shadow-[0_10px_30px_rgba(34,27,11,0.15)]"
            />
            <div
              v-if="imageError && currentRune"
              class="w-full aspect-[2/3] flex flex-col items-center justify-center text-primary border-2 border-dashed border-outline-variant rounded-lg bg-surface-container-lowest"
            >
              <span class="text-6xl font-serif" v-if="currentRune.id !== 'wyrd'"
                >{{ currentRune.symbol }}</span
              >
              <div
                v-else
                class="w-8 h-12 border-2 border-outline-variant/30 rounded-sm mb-1"
              ></div>
              <span class="text-sm mt-4 opacity-70">預留圖片位置</span>
              <span class="text-xs opacity-50 mt-1"
                >請放置 runes_images/{{ currentRune.id }}.png</span
              >
            </div>
          </div>

          <!-- Decorative Paper Tear Effect -->
          <div
            class="absolute bottom-0 left-0 w-full h-8 bg-surface deckle-edge"
          ></div>
        </section>

        <!-- Content Canvas -->
        <div class="px-6 relative z-20 mt-8">
          <div class="text-center mb-10" v-if="currentRune">
            <h2 class="text-4xl font-headline text-primary mb-2">
              {{ currentRune.meaning }}
            </h2>
            <p class="text-sm text-on-surface-variant font-label tracking-wide">
              {{ currentRune.name }}
            </p>
          </div>
          <div class="text-center mb-10" v-else>
            <p class="text-body text-error">
              找不到該符文資料，請返回索引頁重新選擇。
            </p>
          </div>
        </div>
      </main>

      <!-- Bottom Navigation -->
      <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 py-3 bg-[#fff8f2] dark:bg-[#221b0b] border-t border-[#dac2b3]/15 shadow-[0_-4px_20px_rgba(34,27,11,0.06)]"
      >
        <a
          class="flex flex-col items-center justify-center text-[#544338] dark:text-[#dac2b3] opacity-80 hover:text-[#934b00] transition-transform duration-200 active:scale-95 flex-1"
          :href="mascotStudioUrl"
        >
          <span class="material-symbols-outlined">home</span>
          <span class="font-body text-[10px] uppercase tracking-tighter mt-1"
            >回到首頁</span
          >
        </a>
        <a
          class="flex flex-col items-center justify-center text-[#544338] dark:text-[#dac2b3] opacity-80 hover:text-[#934b00] transition-transform duration-200 active:scale-95 flex-1"
          href="runes-index.html"
        >
          <span class="material-symbols-outlined">menu_book</span>
          <span class="font-body text-[10px] uppercase tracking-tighter mt-1"
            >回索引頁</span
          >
        </a>
        <a
          class="flex flex-col items-center justify-center text-[#8f4900] dark:text-[#af6018] font-bold transition-transform duration-200 active:scale-95 flex-1"
          href="#top"
        >
          <span class="material-symbols-outlined">arrow_upward</span>
          <span class="font-body text-[10px] uppercase tracking-tighter mt-1"
            >返回頂部</span
          >
        </a>
      </nav>
    </div>

    <script src="js/data.js"></script>
    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            currentRune: null,
            imageError: false,
            mascotStudioUrl: "/", // 吉祥物工作室的首頁網址設定
          };
        },
        mounted() {
          const params = new URLSearchParams(window.location.search);
          const runeId = params.get("id");

          if (runeId) {
            this.currentRune = runesData.find((r) => r.id === runeId);
          } else {
            this.imageError = true;
          }
        },
        methods: {
          onImageError() {
            // 若圖片尚未放置，會觸發此錯誤並顯示佔位符
            this.imageError = true;
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
